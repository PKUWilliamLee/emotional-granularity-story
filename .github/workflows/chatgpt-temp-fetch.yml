name: ChatGPT Temporary Official Document Fetch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Dongguan plan
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            'https://www.dg.gov.cn/attachment/0/430/430408/4572194.pdf' \
            -o 'output/广东省东莞市.pdf'
          file 'output/广东省东莞市.pdf'
          test "$(stat -c%s 'output/广东省东莞市.pdf')" -gt 100000
      - name: Upload fetched file
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-official-docs-test
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
