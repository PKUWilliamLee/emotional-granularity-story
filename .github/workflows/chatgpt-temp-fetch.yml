name: ChatGPT Temporary Official Document Fetch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Test official-site retrieval through DNS over HTTPS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          python - <<'PY'
          import json, urllib.request
          host='www.dg.gov.cn'
          with urllib.request.urlopen('https://dns.google/resolve?name='+host+'&type=A', timeout=60) as r:
              obj=json.load(r)
          ips=[a['data'] for a in obj.get('Answer',[]) if a.get('type')==1]
          print(obj)
          if not ips: raise SystemExit('no A record')
          open('output/ip.txt','w').write(ips[0])
          PY
          IP="$(cat output/ip.txt)"
          curl -fL --retry 2 --connect-timeout 30 --max-time 600 \
            --resolve "www.dg.gov.cn:443:${IP}" \
            'https://www.dg.gov.cn/attachment/0/430/430408/4572194.pdf' \
            -o 'output/广东省东莞市.pdf'
          file 'output/广东省东莞市.pdf'
          test "$(stat -c%s 'output/广东省东莞市.pdf')" -gt 100000
      - name: Upload test file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-doh-test
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
