name: ChatGPT Temporary Official Document Fetch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Search for missing official Guangdong planning texts
        shell: bash
        run: |
          set -u
          mkdir -p output
          python - <<'PY'
          import urllib.parse, urllib.request, pathlib, time
          queries = {
              '阳江': '阳江市国民经济和社会发展第十五个五年规划纲要 PDF',
              '梅州': '梅州市国民经济和社会发展第十五个五年规划纲要 PDF',
              '清远': '清远市国民经济和社会发展第十五个五年规划纲要 PDF',
              '潮州': '潮州市国民经济和社会发展第十五个五年规划纲要 PDF',
              '珠海': '珠海市国民经济和社会发展第十五个五年规划纲要 PDF',
              '茂名': '茂名市国民经济和社会发展第十五个五年规划纲要 PDF',
          }
          out = pathlib.Path('output')
          headers = {'User-Agent':'Mozilla/5.0'}
          for city, q in queries.items():
              urls = [
                  'https://s.jina.ai/' + urllib.parse.quote(q, safe=''),
                  'https://s.jina.ai/?q=' + urllib.parse.quote(q, safe=''),
                  'https://r.jina.ai/https://www.bing.com/search?q=' + urllib.parse.quote(q, safe=''),
              ]
              for i, url in enumerate(urls, 1):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=180) as r:
                          data = r.read()
                      (out / f'{city}_search_{i}.md').write_bytes(data)
                      print(city, i, len(data), url)
                  except Exception as e:
                      (out / f'{city}_search_{i}.error.txt').write_text(repr(e), encoding='utf-8')
                      print('ERROR', city, i, repr(e))
                  time.sleep(1)
          PY
          find output -type f -maxdepth 1 -printf '%f %s bytes\n' | sort
      - name: Upload search material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-guangdong-search-material
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
