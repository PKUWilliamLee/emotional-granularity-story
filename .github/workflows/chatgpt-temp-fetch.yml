name: ChatGPT Temporary Official Document Fetch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve official Dongguan plan through document reader
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            'https://r.jina.ai/https://www.dg.gov.cn/attachment/0/430/430408/4572194.pdf' \
            -o 'output/广东省东莞市.md'
          wc -c 'output/广东省东莞市.md'
          test "$(stat -c%s 'output/广东省东莞市.md')" -gt 50000
          grep -q '东莞市' 'output/广东省东莞市.md'
          grep -q '第十五个五年规划' 'output/广东省东莞市.md'
      - name: Upload fetched file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-official-docs-test
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
