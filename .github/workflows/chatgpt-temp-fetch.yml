name: ChatGPT Temporary Official Document Fetch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read known source pages for missing Guangdong plans
        shell: bash
        run: |
          set -u
          mkdir -p output
          python - <<'PY'
          import urllib.request, pathlib, time
          urls = {
            '阳江_官方发布页': 'https://www.yangjiang.gov.cn/gkmlpt/content/0/963/post_963892.html?jump=true',
            '阳江_政府公报索引': 'https://www.yangjiang.gov.cn/zwgk/zfgb/mindex.html',
            '梅州_维基百科': 'https://zh.wikipedia.org/wiki/%E6%A2%85%E5%B7%9E%E5%B8%82',
            '梅州_年鉴镜像索引': 'https://www.gev.org.cn/news33.html',
            '清远_年鉴附件页': 'https://www.gev.org.cn/news/10719.html',
            '潮州_报告索引': 'https://www.mouse0232.cn/20260809datareport.html',
            '潮州_报告商城': 'https://www.sgpjbg.com.cn/baogao/1287677.html',
            '珠海_政府首页': 'https://www.zhuhai.gov.cn/',
            '珠海_人大': 'https://www.zhrd.gov.cn/',
            '茂名_政府两会专题': 'https://www.maoming.gov.cn/zt2026mmlh/',
            '茂名_政府首页': 'https://www.maoming.gov.cn/',
          }
          out=pathlib.Path('output')
          headers={'User-Agent':'Mozilla/5.0'}
          for name,url in urls.items():
            proxy='https://r.jina.ai/'+url
            try:
              req=urllib.request.Request(proxy,headers=headers)
              with urllib.request.urlopen(req,timeout=240) as r:
                data=r.read()
              (out/f'{name}.md').write_bytes(data)
              print(name,len(data),proxy)
            except Exception as e:
              (out/f'{name}.error.txt').write_text(repr(e),encoding='utf-8')
              print('ERROR',name,repr(e))
            time.sleep(1)
          PY
          find output -type f -maxdepth 1 -printf '%f %s bytes\n' | sort
      - name: Upload page material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-guangdong-source-pages
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
